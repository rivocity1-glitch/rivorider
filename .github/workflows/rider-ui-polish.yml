name: Rider UI polish

on:
  push:
    branches:
      - test/all-rider

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-rider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted rider UX changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Fix the existing dashboard status state and keep only one shift-selection entry point.
          dash = Path('src/app/(tabs)/dashboard.tsx')
          s = dash.read_text(encoding='utf-8')
          if 'const hasActiveShift = !!activeShift;' not in s:
              anchor = '  const [activeShift, setActiveShift] = useState<any>(null);\n'
              if s.count(anchor) != 1:
                  raise SystemExit('dashboard: activeShift state anchor not found exactly once')
              s = s.replace(anchor, anchor + '  const hasActiveShift = !!activeShift;\n', 1)
          duplicate = '''                ) : (\n                  <TouchableOpacity\n                    onPress={() => {\n                      if (rider?.kyc_status !== 'verified') {\n                        Alert.alert('KYC Required', 'Complete your KYC verification first.');\n                      } else {\n                        setShiftModalVisible(true);\n                      }\n                    }}\n                    style={[styles.actionBtn, { backgroundColor: LOCAL_COLORS.emeraldGreen }]}\n                  >\n                    <Text style={styles.actionBtnText}>Select / Reserve Shift</Text>\n                  </TouchableOpacity>\n                )}'''
          if duplicate in s:
              s = s.replace(duplicate, '                ) : null', 1)
          else:
              # Also accept the compact variant if formatting changed.
              compact = '''                ) : (\n                  <TouchableOpacity\n                    onPress={() => {\n                      if (rider?.kyc_status !== 'verified') {\n                        Alert.alert('KYC Required', 'Complete your KYC verification first.');\n                      } else {\n                        setShiftModalVisible(true);\n                      }\n                    }}\n                    style={[styles.actionBtn, { backgroundColor: LOCAL_COLORS.emeraldGreen }]}\n                  >\n                    <Text style={styles.actionBtnText}>Select / Reserve Shift</Text>\n                  </TouchableOpacity>\n                )}'''
              if compact in s:
                  s = s.replace(compact, '                ) : null', 1)
              elif 'Select / Reserve Shift' in s:
                  raise SystemExit('dashboard: duplicate shift button exists but expected block was not found')
          dash.write_text(s, encoding='utf-8')

          # Earnings: remove manual withdrawal mechanics and present the automatic weekly payout schedule.
          settle = Path('src/app/(tabs)/settlements.tsx')
          s = settle.read_text(encoding='utf-8')
          s = s.replace('  const [submitting, setSubmitting] = useState<boolean>(false);\n', '')
          s = s.replace('  const actionButtonScale = useRef(new Animated.Value(1)).current;\n\n  const animateButtonPressIn = () => {\n    Animated.timing(actionButtonScale, { toValue: 0.96, duration: 80, useNativeDriver: true }).start();\n  };\n\n  const animateButtonPressOut = () => {\n    Animated.timing(actionButtonScale, { toValue: 1, duration: 80, useNativeDriver: true }).start();\n  };\n', '')
          start = s.find('  const handleRequestSettlement = async () => {')
          if start != -1:
              end = s.find('\n  const getStatusBadgeConfig', start)
              if end == -1:
                  raise SystemExit('settlements: could not find end of withdrawal handler')
              s = s[:start] + s[end:]
          # Add joining date and next automatic payout helpers after date formatter.
          marker = '''  const fetchData = useCallback(async (currentRiderId: string, isSilent = false) => {'''
          helper = '''  const formatScheduleDate = (date: Date) =>\n    date.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });\n\n  const getNextPayoutDate = (joinedAt: string | null) => {\n    const now = new Date();\n    if (!joinedAt) return null;\n    const joined = new Date(joinedAt);\n    if (Number.isNaN(joined.getTime())) return null;\n\n    const next = new Date(joined);\n    while (next <= now) next.setDate(next.getDate() + 7);\n    // Bank credits are processed on weekdays. If the weekly date falls on\n    // Saturday/Sunday, move it to the following Monday.\n    const day = next.getDay();\n    if (day === 6) next.setDate(next.getDate() + 2);\n    if (day === 0) next.setDate(next.getDate() + 1);\n    return next;\n  };\n\n'''
          if marker in s and 'const getNextPayoutDate' not in s:
              s = s.replace(marker, helper + marker, 1)
          # Track rider joining date using the existing riders.created_at field.
          s = s.replace('  const [riderId, setRiderId] = useState<string | null>(null);\n', '  const [riderId, setRiderId] = useState<string | null>(null);\n  const [riderJoinedAt, setRiderJoinedAt] = useState<string | null>(null);\n')
          s = s.replace('          .select("id")\n', '          .select("id, created_at")\n', 1)
          s = s.replace('          setRiderId(riderData.id);\n          fetchData(riderData.id);\n', '          setRiderId(riderData.id);\n          setRiderJoinedAt(riderData.created_at || null);\n          fetchData(riderData.id);\n', 1)
          s = s.replace('Earnings & Withdrawals', 'Earnings & Payouts')
          s = s.replace('Track earnings and request payouts.', 'Track earnings and automatic weekly payouts.')
          s = s.replace('AVAILABLE TO WITHDRAW', 'AVAILABLE EARNINGS')
          # Replace the manual action panel content with automatic payout messaging.
          import re
          pattern = re.compile(r'\s*\{\/\* ACTION PANEL \*\/\}.*?(?=\s*\{\/\* HISTORY \*\/\})', re.S)
          replacement = '''\n\n            {/* AUTOMATIC PAYOUT PANEL */}\n            <View style={[styles.actionPanel, { backgroundColor: theme.cardBg, borderColor: theme.border }]}>\n              <View style={{ alignItems: 'center', marginBottom: 14 }}>\n                <View style={{ width: 46, height: 46, borderRadius: 23, alignItems: 'center', justifyContent: 'center', backgroundColor: COLORS.emeraldGreen + '18', marginBottom: 10 }}>\n                  <Ionicons name="calendar-outline" size={23} color={COLORS.emeraldGreen} />\n                </View>\n                <Text style={[styles.sectionTitle, { color: theme.text, marginBottom: 5 }]}>Automatic Weekly Payout</Text>\n                <Text style={[styles.actionTitle, { color: theme.textMuted }]}>Your eligible earnings are sent automatically to your registered bank account every week.</Text>\n              </View>\n\n              <View style={[styles.payoutInfoBox, { backgroundColor: theme.bg, borderColor: theme.border }]}>\n                <View style={styles.payoutInfoRow}>\n                  <Text style={[styles.detailsLabel, { color: theme.textMuted }]}>JOINED</Text>\n                  <Text style={[styles.detailsValue, { color: theme.text }]}>{riderJoinedAt ? formatScheduleDate(new Date(riderJoinedAt)) : '—'}</Text>\n                </View>\n                <View style={styles.payoutInfoRow}>\n                  <Text style={[styles.detailsLabel, { color: theme.textMuted }]}>NEXT PAYOUT</Text>\n                  <Text style={[styles.detailsValue, { color: COLORS.emeraldGreen }]}>{getNextPayoutDate(riderJoinedAt) ? formatScheduleDate(getNextPayoutDate(riderJoinedAt)!) : '—'}</Text>\n                </View>\n                <View style={styles.payoutInfoRow}>\n                  <Text style={[styles.detailsLabel, { color: theme.textMuted }]}>CREDIT METHOD</Text>\n                  <Text style={[styles.detailsValue, { color: theme.text }]}>Registered bank account</Text>\n                </View>\n              </View>\n\n              <Text style={[styles.approvalWaitSubtext, { color: theme.textMuted }]}>Payouts falling on weekends are credited on the following working day.</Text>\n            </View>\n'''
          if pattern.search(s):
              s = pattern.sub(replacement, s, count=1)
          else:
              raise SystemExit('settlements: ACTION PANEL block not found')
          # Remove old withdrawal-only status logic and button references.
          s = s.replace('''    if (stats.hasPendingSettlement) {\n      return "Your withdrawal request is being processed.";\n    }\n    if (stats.availableBalance < 500) {\n      return "Minimum ₹500 balance required to withdraw.";\n    }\n    if (!stats.isDaysEligible) {\n      return "Withdrawals are available 7 days after completed deliveries.";\n    }\n    return "Your earnings are ready for withdrawal.";''', '''    if (stats.hasPendingSettlement) {\n      return "A previous payout is being processed.";\n    }\n    return "Your eligible earnings will be included in the next weekly payout.";''')
          s = re.sub(r'\n  const isActionDisabled = .*?;\n', '\n', s, count=1)
          s = s.replace('''                      <Text style={[styles.buttonText, isActionDisabled && styles.buttonTextDisabled]}>\n                      Request Withdrawal\n                    </Text>''', '')
          s = s.replace('Withdrawal Request Submitted Successfully', 'Payout scheduled successfully')
          # Ensure no active request button remains.
          if 'Request Withdrawal' in s or 'handleRequestSettlement' in s or 'isActionDisabled' in s:
              raise SystemExit('settlements: manual withdrawal references remain')
          # Add styles for the payout information box.
          style_marker = '''  approvalWaitSubtext: {'''
          payout_styles = '''  payoutInfoBox: {\n    borderRadius: 16,\n    borderWidth: 1,\n    padding: 14,\n    marginTop: 4,\n    marginBottom: 10,\n  },\n  payoutInfoRow: {\n    flexDirection: 'row',\n    justifyContent: 'space-between',\n    alignItems: 'center',\n    paddingVertical: 7,\n  },\n'''
          if 'payoutInfoBox:' not in s:
              if style_marker not in s:
                  raise SystemExit('settlements: style insertion marker not found')
              s = s.replace(style_marker, payout_styles + style_marker, 1)
          settle.write_text(s, encoding='utf-8')

          # Profile: make the page informational by default; location is only edited from its own section.
          profile = Path('src/app/(tabs)/profile.tsx')
          s = profile.read_text(encoding='utf-8')
          if 'created_at?: string;' not in s:
              s = s.replace('  id: string;\n  auth_user_id: string;', '  id: string;\n  created_at?: string;\n  auth_user_id: string;', 1)
          # Replace the always-visible GPS action with a deliberate Manage Location button and collapsible editor.
          s = s.replace("  const [savingLocation, setSavingLocation] = useState(false);\n", "  const [savingLocation, setSavingLocation] = useState(false);\n  const [isLocationEditorOpen, setIsLocationEditorOpen] = useState(false);\n", 1)
          old_location_button = '''            <TouchableOpacity\n              style={[\n                styles.locationButton,\n                {\n                  backgroundColor:\n                    COLORS.emeraldGreen,\n                },\n              ]}\n              onPress={\n                handleUseCurrentLocation\n              }\n              disabled={\n                savingLocation\n              }\n            >\n              {savingLocation ? (\n                <ActivityIndicator\n                  color="#fff"\n                />\n              ) : (\n                <>\n                  <Ionicons\n                    name="navigate-outline"\n                    size={18}\n                    color="#fff"\n                    style={{\n                      marginRight: 7,\n                    }}\n                  />\n\n                  <Text\n                    style={\n                      styles.locationButtonText\n                    }\n                  >\n                    Use My Current Location\n                  </Text>\n                </>\n              )}\n            </TouchableOpacity>\n'''
          new_location_button = '''            <TouchableOpacity\n              style={[styles.outlineButton, { borderColor: COLORS.emeraldGreen, marginBottom: 10 }]}\n              onPress={() => setIsLocationEditorOpen((value) => !value)}\n            >\n              <Ionicons name="location-outline" size={18} color={COLORS.emeraldGreen} style={{ marginRight: 7 }} />\n              <Text style={[styles.outlineButtonText, { color: COLORS.emeraldGreen }]}>\n                {hasResidenceLocation ? 'Update / Change Location' : 'Add Residence Location'}\n              </Text>\n            </TouchableOpacity>\n\n            {!isLocationEditorOpen && hasResidenceLocation ? (\n              <View style={[styles.savedLocationBox, { backgroundColor: theme.bg, borderColor: theme.border }]}>\n                <Ionicons name="checkmark-circle" size={18} color={COLORS.emeraldGreen} />\n                <View style={{ flex: 1, marginLeft: 9 }}>\n                  <Text style={[styles.savedLocationTitle, { color: theme.text }]}>Location saved</Text>\n                  <Text style={[styles.savedLocationText, { color: theme.textMuted }]}>{[address, city, state, pinCode].filter(Boolean).join(', ') || 'Pinned GPS location saved'}</Text>\n                </View>\n              </View>\n            ) : null}\n\n            {isLocationEditorOpen ? (\n              <View style={[styles.locationEditor, { borderTopColor: theme.border }]}>\n                <Text style={[styles.sectionDescription, { color: theme.textMuted, marginBottom: 10 }]}>Use GPS only when you choose to update this location, or edit the address manually.</Text>\n                <TouchableOpacity\n                  style={[styles.locationButton, { backgroundColor: COLORS.emeraldGreen }]}\n                  onPress={handleUseCurrentLocation}\n                  disabled={savingLocation}\n                >\n                  {savingLocation ? <ActivityIndicator color="#fff" /> : <>\n                    <Ionicons name="navigate-outline" size={18} color="#fff" style={{ marginRight: 7 }} />\n                    <Text style={styles.locationButtonText}>Use Current Location</Text>\n                  </>}\n                </TouchableOpacity>\n'''
          if old_location_button in s:
              s = s.replace(old_location_button, new_location_button, 1)
          elif 'Use My Current Location' in s:
              raise SystemExit('profile: location button block not found')
          # Close the editor after the existing Save Location button.
          save_button = '''            <TouchableOpacity\n              style={[\n                styles.outlineButton,\n                {\n                  borderColor:\n                    COLORS.emeraldGreen,\n                },\n              ]}\n              onPress={\n                handleSaveLocation\n              }\n              disabled={\n                savingLocation\n              }\n            >'''
          if save_button not in s:
              raise SystemExit('profile: location save button not found')
          # Insert closing editor after the button's complete block by targeting the following KYC marker.
          kyc_marker = '\n          {/* KYC STATUS */}'
          if kyc_marker not in s:
              raise SystemExit('profile: KYC marker not found')
          # Only close the editor immediately before KYC; the editor opening is unique in the replacement above.
          s = s.replace(kyc_marker, '\n              </View>\n            ) : null\n          </View>' + kyc_marker, 1)

          # Insert a comprehensive read-only rider information card before Residence Location.
          residence_marker = '          {/* RESIDENCE LOCATION */}'
          info_card = '''          {/* RIDER INFORMATION */}\n          <View style={[styles.card, { backgroundColor: theme.cardBg, borderColor: theme.border }]}>\n            <View style={styles.sectionHeaderRow}>\n              <View style={{ flex: 1 }}>\n                <Text style={[styles.cardTitle, { color: theme.text }]}>Rider Information</Text>\n                <Text style={[styles.sectionDescription, { color: theme.textMuted }]}>Your registered details and submitted information.</Text>\n              </View>\n              <Ionicons name="person-circle-outline" size={24} color={COLORS.emeraldGreen} />\n            </View>\n\n            <View style={styles.infoGrid}>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>FULL NAME</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.rider_name || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>RIDER ID</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.rider_code || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>PHONE</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.phone || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>EMAIL</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.email || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>GENDER</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.gender || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>BLOOD GROUP</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.blood_group || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>VEHICLE</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.vehicle_type || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>STATUS</Text><Text style={[styles.infoValue, { color: rider.status === 'active' ? COLORS.emeraldGreen : theme.text }]}>{rider.status || '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>JOINED</Text><Text style={[styles.infoValue, { color: theme.text }]}>{rider.created_at ? new Date(rider.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</Text></View>\n              <View style={styles.infoGridItem}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>KYC STATUS</Text><Text style={[styles.infoValue, { color: rider.kyc_status === 'verified' ? COLORS.emeraldGreen : theme.text }]}>{kycStatus.replace('_', ' ')}</Text></View>\n            </View>\n\n            <View style={[styles.infoDivider, { backgroundColor: theme.border }]} />\n            <Text style={[styles.cardTitle, { color: theme.text, marginBottom: 10 }]}>Submitted Documents</Text>\n            <View style={styles.documentStatusRow}><Ionicons name={selfieUri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={selfieUri ? COLORS.emeraldGreen : theme.textMuted} /><Text style={[styles.documentStatusText, { color: theme.text }]}>Selfie {selfieUri ? 'uploaded' : 'not uploaded'}</Text></View>\n            <View style={styles.documentStatusRow}><Ionicons name={aadhaarFrontUri && aadhaarBackUri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={aadhaarFrontUri && aadhaarBackUri ? COLORS.emeraldGreen : theme.textMuted} /><Text style={[styles.documentStatusText, { color: theme.text }]}>Aadhaar {aadhaarFrontUri || aadhaarBackUri ? 'submitted' : 'not submitted'}</Text></View>\n            <View style={styles.documentStatusRow}><Ionicons name={panUri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={panUri ? COLORS.emeraldGreen : theme.textMuted} /><Text style={[styles.documentStatusText, { color: theme.text }]}>PAN {panUri ? 'uploaded' : 'not uploaded'}</Text></View>\n            <View style={styles.documentStatusRow}><Ionicons name={drivingLicenseUri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={drivingLicenseUri ? COLORS.emeraldGreen : theme.textMuted} /><Text style={[styles.documentStatusText, { color: theme.text }]}>Driving Licence {drivingLicenseUri ? 'uploaded' : 'not uploaded'}</Text></View>\n            <View style={styles.documentStatusRow}><Ionicons name={qrCodeUri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={qrCodeUri ? COLORS.emeraldGreen : theme.textMuted} /><Text style={[styles.documentStatusText, { color: theme.text }]}>Payment QR {qrCodeUri ? 'uploaded' : 'not uploaded'}</Text></View>\n\n            <View style={[styles.infoDivider, { backgroundColor: theme.border }]} />\n            <Text style={[styles.cardTitle, { color: theme.text, marginBottom: 10 }]}>Bank & Payment</Text>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>ACCOUNT HOLDER</Text><Text style={[styles.infoValue, { color: theme.text }]}>{accountHolder || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>BANK</Text><Text style={[styles.infoValue, { color: theme.text }]}>{bankName || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>ACCOUNT</Text><Text style={[styles.infoValue, { color: theme.text }]}>{accountNumber ? `•••• ${accountNumber.slice(-4)}` : '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>IFSC</Text><Text style={[styles.infoValue, { color: theme.text }]}>{ifsc || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>UPI</Text><Text style={[styles.infoValue, { color: theme.text }]}>{upi || '—'}</Text></View>\n\n            <TouchableOpacity style={[styles.submitButton, { backgroundColor: COLORS.emeraldGreen, marginTop: 14 }]} onPress={() => setIsKycModalOpen(true)}>\n              <Text style={styles.submitButtonText}>View / Update Documents & Bank</Text>\n            </TouchableOpacity>\n          </View>\n\n'''
          if residence_marker not in s:
              raise SystemExit('profile: residence marker not found')
          if 'Rider Information' not in s:
              s = s.replace(residence_marker, info_card + residence_marker, 1)
          # Add styles for information card.
          style_marker = '  centeredContainer: {'
          styles_add = '''  infoGrid: {\n    flexDirection: 'row',\n    flexWrap: 'wrap',\n    marginHorizontal: -5,\n  },\n  infoGridItem: {\n    width: '50%',\n    paddingHorizontal: 5,\n    marginBottom: 12,\n  },\n  infoLabel: {\n    fontSize: 10,\n    fontWeight: '700',\n    letterSpacing: 0.3,\n    marginBottom: 3,\n  },\n  infoValue: {\n    fontSize: 13,\n    fontWeight: '700',\n  },\n  infoDivider: {\n    height: 1,\n    marginVertical: 12,\n  },\n  documentStatusRow: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    marginBottom: 9,\n  },\n  documentStatusText: {\n    fontSize: 13,\n    fontWeight: '600',\n    marginLeft: 8,\n  },\n  detailLine: {\n    flexDirection: 'row',\n    justifyContent: 'space-between',\n    alignItems: 'center',\n    paddingVertical: 7,\n  },\n  savedLocationBox: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    borderWidth: 1,\n    borderRadius: 14,\n    padding: 12,\n    marginBottom: 10,\n  },\n  savedLocationTitle: {\n    fontSize: 13,\n    fontWeight: '700',\n  },\n  savedLocationText: {\n    fontSize: 11,\n    lineHeight: 16,\n    marginTop: 2,\n  },\n  locationEditor: {\n    borderTopWidth: 1,\n    paddingTop: 12,\n    marginTop: 2,\n  },\n'''
          if 'infoGrid:' not in s:
              if style_marker not in s:
                  raise SystemExit('profile: style insertion marker not found')
              s = s.replace(style_marker, styles_add + style_marker, 1)
          profile.write_text(s, encoding='utf-8')

          print('Targeted rider UX changes applied.')
          PY

      - name: Type check
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit and clean up patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/(tabs)/dashboard.tsx src/app/(tabs)/settlements.tsx src/app/(tabs)/profile.tsx
          git add -u .github/workflows/rider-ui-polish.yml
          git commit -m "Polish rider shifts payouts and profile" || true
          git rm -f .github/workflows/rider-ui-polish.yml || true
          git commit -m "Remove temporary rider UI patch workflow" || true
          git push origin test/all-rider
