name: One-time Rider Availability UX Patch

on:
  push:
    branches:
      - test/all-rider

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v6
        with:
          ref: test/all-rider

      - name: Apply rider availability UX patch
        run: python3 scripts/one_time_rider_availability_ux.py

      - name: Commit and push code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(tabs)/dashboard.tsx"
          git rm .github/workflows/one-time-rider-availability-ux.yml scripts/one_time_rider_availability_ux.py
          git commit -m "feat: simplify rider shift availability UX"
          git push origin test/all-rider
