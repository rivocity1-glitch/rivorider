name: Rider UI cleanup

on:
  push:
    branches:
      - test/all-rider

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-rider
          fetch-depth: 0
      - name: Fix validation issues and clean workflows
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/app/(tabs)/profile.tsx')
          s = p.read_text(encoding='utf-8')
          if 'infoValue:' not in s:
              marker = '  infoDivider: {'
              if marker not in s: raise SystemExit('profile info style marker missing')
              s = s.replace(marker, "  infoValue: { fontSize: 13, fontWeight: '700' },\n" + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/app/_layout.tsx')
          s = p.read_text(encoding='utf-8')
          old = "    const inResetPassword = inAuthGroup && segments[1] === 'reset-password';"
          new = "    const inResetPassword = inAuthGroup && String(segments[1] ?? '') === 'reset-password';"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/(tabs)/dashboard.tsx src/app/(tabs)/settlements.tsx src/app/(tabs)/profile.tsx src/app/_layout.tsx
          git commit -m "Polish rider shifts payouts and profile"
          git rm -f .github/workflows/rider-ui-polish.yml .github/workflows/rider-ui-polish-v2.yml .github/workflows/rider-ui-finalize.yml .github/workflows/rider-ui-final.yml .github/workflows/rider-ui-cleanup.yml || true
          git commit -m "Remove temporary rider UI patch workflows" || true
          git push origin test/all-rider
