name: Fix Delivery Currency Display

on:
  push:
    branches:
      - rider-payment-auth-improvements

permissions:
  contents: write

jobs:
  fix-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rider branch
        uses: actions/checkout@v4
        with:
          ref: rider-payment-auth-improvements

      - name: Fix delivery currency and call text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/app/(tabs)/deliveries.tsx")
          text = path.read_text(encoding="utf-8")

          # Keep currency rendering independent of source-file encoding.
          marker = "const RUPEE = String.fromCharCode(0x20B9);"
          if marker not in text:
              anchor = "import { supabase } from '../../lib/supabase';"
              if anchor not in text:
                  raise SystemExit("Could not find Supabase import anchor")
              text = text.replace(anchor, anchor + "\n\n" + marker, 1)

          # Remove emoji from the call buttons. Use the existing Ionicons import
          # so Android never displays mojibake glyphs such as ðŸ“ž.
          phone = "\\U0001F4DE"
          text = text.replace(phone + " Call Customer", "Call Customer")
          text = text.replace(phone + " Call Vendor", "Call Vendor")

          # Replace any escaped currency expression left by older edits.
          text = text.replace("{'\\\\u20B9'}", "{RUPEE}")
          text = text.replace("{'\\u20B9'}", "{RUPEE}")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-delivery-currency-display.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: stabilize rider delivery currency display"
          git push origin rider-payment-auth-improvements
