name: Rider UI polish v2

on:
  push:
    branches:
      - test/all-rider

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-rider
          fetch-depth: 0
      - name: Patch rider UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Dashboard: fix state and remove the second shift-selection button.
          p = Path('src/app/(tabs)/dashboard.tsx')
          s = p.read_text(encoding='utf-8')
          if 'const hasActiveShift = !!activeShift;' not in s:
              anchor = '  const [activeShift, setActiveShift] = useState<any>(null);\n'
              if s.count(anchor) != 1: raise SystemExit('dashboard activeShift anchor mismatch')
              s = s.replace(anchor, anchor + '  const hasActiveShift = !!activeShift;\n', 1)
          if 'Select / Reserve Shift' in s:
              s2, n = re.subn(r'''\s*\) : \(\s*<TouchableOpacity\s*onPress=\{\(\) => \{\s*if \(rider\?\.kyc_status !== 'verified'\) \{\s*Alert\.alert\('KYC Required', 'Complete your KYC verification first\.'\);\s*\} else \{\s*setShiftModalVisible\(true\);\s*\}\s*\}\}\s*style=\{\[styles\.actionBtn, \{ backgroundColor: LOCAL_COLORS\.emeraldGreen \}\]\}\s*>\s*<Text style=\{styles\.actionBtnText\}>Select / Reserve Shift</Text>\s*</TouchableOpacity>\s*\)\}''', '                ) : null', s, count=1)
              if n != 1: raise SystemExit('dashboard duplicate shift button pattern not found')
              s = s2
          p.write_text(s, encoding='utf-8')

          # Earnings: turn manual withdrawal into automatic weekly payout information.
          p = Path('src/app/(tabs)/settlements.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Earnings & Withdrawals', 'Earnings & Payouts')
          s = s.replace('Track earnings and request payouts.', 'Track earnings and automatic weekly payouts.')
          s = s.replace('AVAILABLE TO WITHDRAW', 'AVAILABLE EARNINGS')
          # Remove the manual request handler if present.
          start = s.find('  const handleRequestSettlement = async () => {')
          if start != -1:
              end = s.find('\n  const getStatusBadgeConfig', start)
              if end == -1: raise SystemExit('settlement handler end not found')
              s = s[:start] + s[end:]
          # Replace the interactive withdrawal button itself with a clear, non-interactive payout card.
          if 'Request Withdrawal' in s:
              pat = re.compile(r'<TouchableOpacity(?P<body>.*?Request Withdrawal.*?</TouchableOpacity>)', re.S)
              m = pat.search(s)
              if not m: raise SystemExit('withdrawal button not found')
              replacement = '''<View style={[styles.autoPayoutCard, { backgroundColor: theme.bg, borderColor: theme.border }]}>\n                        <View style={styles.autoPayoutIcon}><Ionicons name="calendar-outline" size={21} color={COLORS.emeraldGreen} /></View>\n                        <View style={{ flex: 1 }}>\n                          <Text style={[styles.autoPayoutTitle, { color: theme.text }]}>Automatic Weekly Payout</Text>\n                          <Text style={[styles.autoPayoutText, { color: theme.textMuted }]}>Eligible earnings are sent automatically every 7 days based on your joining date and credited to your registered bank account on working days.</Text>\n                        </View>\n                      </View>'''
              s = s[:m.start()] + replacement + s[m.end():]
          s = s.replace('Withdrawal Request Submitted Successfully', 'Payout scheduled successfully')
          s = s.replace('Your withdrawal request is being processed.', 'Your previous payout is being processed.')
          s = s.replace('Minimum ₹500 balance required to withdraw.', 'Your eligible earnings are included in the next weekly payout.')
          s = s.replace('Withdrawals are available 7 days after completed deliveries.', 'Payouts are processed automatically every 7 days from your joining date.')
          s = s.replace('Your earnings are ready for withdrawal.', 'Your eligible earnings will be included in the next weekly payout.')
          s = re.sub(r'\n  const isActionDisabled = .*?;\n', '\n', s, count=1)
          if 'Request Withdrawal' in s or 'handleRequestSettlement' in s or 'isActionDisabled' in s:
              raise SystemExit('manual withdrawal reference remains')
          if 'autoPayoutCard:' not in s:
              marker = '  approvalWaitSubtext: {'
              styles = '''  autoPayoutCard: {\n    flexDirection: 'row',\n    alignItems: 'flex-start',\n    borderRadius: 16,\n    borderWidth: 1,\n    padding: 14,\n    marginTop: 12,\n  },\n  autoPayoutIcon: {\n    width: 40,\n    height: 40,\n    borderRadius: 20,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: COLORS.emeraldGreen + '18',\n    marginRight: 11,\n  },\n  autoPayoutTitle: {\n    fontSize: 13,\n    fontWeight: '800',\n    marginBottom: 3,\n  },\n  autoPayoutText: {\n    fontSize: 11,\n    lineHeight: 16,\n  },\n'''
              if marker not in s: raise SystemExit('settlement style marker missing')
              s = s.replace(marker, styles + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Profile: show the stored rider information prominently and make location a deliberate profile action.
          p = Path('src/app/(tabs)/profile.tsx')
          s = p.read_text(encoding='utf-8')
          if 'created_at?: string;' not in s:
              s = s.replace('  id: string;\n  auth_user_id: string;', '  id: string;\n  created_at?: string;\n  auth_user_id: string;', 1)
          # Replace the prominent GPS wording with an intentional update action.
          s = s.replace('Use My Current Location', 'Update Location with GPS')
          s = s.replace('Add where you live. Use GPS or enter the address manually.', 'Your saved residence location. Update it only when you need to add or change it.')
          # Add a comprehensive read-only information card once.
          if 'Rider Information' not in s:
              marker = '          {/* RESIDENCE LOCATION */}'
              if marker not in s: raise SystemExit('profile residence marker missing')
              card = '''          {/* RIDER INFORMATION */}\n          <View style={[styles.card, { backgroundColor: theme.cardBg, borderColor: theme.border }]}>\n            <View style={styles.sectionHeaderRow}>\n              <View style={{ flex: 1 }}>\n                <Text style={[styles.cardTitle, { color: theme.text }]}>Rider Information</Text>\n                <Text style={[styles.sectionDescription, { color: theme.textMuted }]}>All registered details and submitted information.</Text>\n              </View>\n              <Ionicons name="person-circle-outline" size={24} color={COLORS.emeraldGreen} />\n            </View>\n            <View style={styles.infoGrid}>\n              {[["FULL NAME", rider.rider_name], ["RIDER ID", rider.rider_code], ["PHONE", rider.phone], ["EMAIL", rider.email], ["GENDER", rider.gender], ["BLOOD GROUP", rider.blood_group], ["VEHICLE", rider.vehicle_type], ["STATUS", rider.status], ["JOINED", rider.created_at ? new Date(rider.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : null], ["KYC STATUS", kycStatus.replace('_', ' ') ]].map(([label, value]) => (\n                <View key={String(label)} style={styles.infoGridItem}>\n                  <Text style={[styles.infoLabel, { color: theme.textMuted }]}>{label}</Text>\n                  <Text style={[styles.infoValue, { color: theme.text }]}>{value || '—'}</Text>\n                </View>\n              ))}\n            </View>\n            <View style={[styles.infoDivider, { backgroundColor: theme.border }]} />\n            <Text style={[styles.cardTitle, { color: theme.text, marginBottom: 10 }]}>Submitted Documents</Text>\n            {[\n              ['Selfie', selfieUri],\n              ['Aadhaar', aadhaarFrontUri || aadhaarBackUri],\n              ['PAN', panUri],\n              ['Driving Licence', drivingLicenseUri],\n              ['Payment QR', qrCodeUri],\n            ].map(([label, uri]) => (\n              <View key={String(label)} style={styles.documentStatusRow}>\n                <Ionicons name={uri ? 'checkmark-circle' : 'ellipse-outline'} size={18} color={uri ? COLORS.emeraldGreen : theme.textMuted} />\n                <Text style={[styles.documentStatusText, { color: theme.text }]}>{label} {uri ? 'uploaded' : 'not uploaded'}</Text>\n              </View>\n            ))}\n            <View style={[styles.infoDivider, { backgroundColor: theme.border }]} />\n            <Text style={[styles.cardTitle, { color: theme.text, marginBottom: 10 }]}>Bank & Payment</Text>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>ACCOUNT HOLDER</Text><Text style={[styles.infoValue, { color: theme.text }]}>{accountHolder || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>BANK</Text><Text style={[styles.infoValue, { color: theme.text }]}>{bankName || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>ACCOUNT</Text><Text style={[styles.infoValue, { color: theme.text }]}>{accountNumber ? `•••• ${accountNumber.slice(-4)}` : '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>IFSC</Text><Text style={[styles.infoValue, { color: theme.text }]}>{ifsc || '—'}</Text></View>\n            <View style={styles.detailLine}><Text style={[styles.infoLabel, { color: theme.textMuted }]}>UPI</Text><Text style={[styles.infoValue, { color: theme.text }]}>{upi || '—'}</Text></View>\n            <TouchableOpacity style={[styles.submitButton, { backgroundColor: COLORS.emeraldGreen, marginTop: 14 }]} onPress={() => setIsKycModalOpen(true)}>\n              <Text style={styles.submitButtonText}>View / Update Documents & Bank</Text>\n            </TouchableOpacity>\n          </View>\n\n'''
              s = s.replace(marker, card + marker, 1)
          if 'infoGrid:' not in s:
              marker = '  centeredContainer: {'
              styles = '''  infoGrid: { flexDirection: 'row', flexWrap: 'wrap', marginHorizontal: -5 },\n  infoGridItem: { width: '50%', paddingHorizontal: 5, marginBottom: 12 },\n  infoLabel: { fontSize: 10, fontWeight: '700', letterSpacing: 0.3, marginBottom: 3 },\n  infoValue: { fontSize: 13, fontWeight: '700' },\n  infoDivider: { height: 1, marginVertical: 12 },\n  documentStatusRow: { flexDirection: 'row', alignItems: 'center', marginBottom: 9 },\n  documentStatusText: { fontSize: 13, fontWeight: '600', marginLeft: 8 },\n  detailLine: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', paddingVertical: 7 },\n'''
              if marker not in s: raise SystemExit('profile style marker missing')
              s = s.replace(marker, styles + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('Rider UI patch complete')
          PY
      - name: Validate and commit
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/(tabs)/dashboard.tsx src/app/(tabs)/settlements.tsx src/app/(tabs)/profile.tsx
          git commit -m "Polish rider shifts payouts and profile"
          git rm -f .github/workflows/rider-ui-polish.yml .github/workflows/rider-ui-polish-v2.yml || true
          git commit -m "Remove temporary rider UI patch workflows" || true
          git push origin test/all-rider
