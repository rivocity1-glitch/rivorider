name: Fix Map Navigation Integration

on:
  push:
    branches:
      - feature/map-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-navigation

      - name: Apply integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/(tabs)/deliveries.tsx')
          text = path.read_text()

          if "from '../../lib/customerNavigation'" not in text:
              text = text.replace(
                  "import { supabase } from '../../lib/supabase';",
                  "import { supabase } from '../../lib/supabase';\nimport { navigateToCustomer } from '../../lib/customerNavigation';",
                  1,
              )

          if 'vendor_location:' not in text:
              text = text.replace(
                  "  customer_address_id?: string | null;\n  customer: { customer_name: string; phone?: string | null } | null;",
                  "  customer_address_id?: string | null;\n  vendor_location: { latitude: number | null; longitude: number | null } | null;\n  customer: { customer_name: string; phone?: string | null } | null;",
                  1,
              )

          if 'const vendorIds = Array.from(' not in text:
              marker = "      const orderIds = (ordersData || []).map((o: any) => o.id);"
              insert = """      const vendorIds = Array.from(\n        new Set(\n          (ordersData || [])\n            .map((order: any) => order.vendor_id)\n            .filter(Boolean)\n        )\n      );\n\n      const vendorLocationsMap: Record<string, { latitude: number | null; longitude: number | null }> = {};\n\n      if (vendorIds.length > 0) {\n        const { data: vendorProfiles, error: vendorProfilesError } = await supabase\n          .from('vendor_profiles')\n          .select('vendor_id, latitude, longitude')\n          .in('vendor_id', vendorIds);\n\n        if (vendorProfilesError) {\n          console.warn('Vendor location lookup warning:', vendorProfilesError);\n        } else if (vendorProfiles) {\n          vendorProfiles.forEach((profile: any) => {\n            vendorLocationsMap[profile.vendor_id] = {\n              latitude: profile.latitude ?? null,\n              longitude: profile.longitude ?? null,\n            };\n          });\n        }\n      }\n\n"""
              if marker not in text:
                  raise SystemExit('Vendor location insertion marker not found')
              text = text.replace(marker, insert + marker, 1)

          if 'vendor_location: vendorLocationsMap[order.vendor_id]' not in text:
              marker = "          customer_address_id: order.customer_address_id || null,\n          customer: Array.isArray(order.customer) ? order.customer[0] : order.customer,"
              replacement = "          customer_address_id: order.customer_address_id || null,\n          vendor_location: vendorLocationsMap[order.vendor_id] || null,\n          customer: Array.isArray(order.customer) ? order.customer[0] : order.customer,"
              if marker not in text:
                  raise SystemExit('Parsed order marker not found')
              text = text.replace(marker, replacement, 1)

          if 'const handleNavigateToCustomer = async' not in text:
              marker = "  const handleCallContact = (type: 'vendor' | 'customer', order: Order) => {"
              insert = """  const handleNavigateToCustomer = async (order: Order) => {\n    const opened = await navigateToCustomer(\n      order.vendor_location || {},\n      order.customer_addresses || {}\n    );\n\n    if (opened) {\n      showSuccessToast('Opening Google Maps Navigation');\n    }\n  };\n\n"""
              if marker not in text:
                  raise SystemExit('Navigation handler marker not found')
              text = text.replace(marker, insert + marker, 1)

          if 'onPress={() => handleNavigateToCustomer(item)}' not in text:
              marker = "onPress={() => updateOrderStatusDirectly(item.id, 'out_for_delivery')}"
              action_index = text.find(marker)
              if action_index < 0:
                  raise SystemExit('Out-for-delivery action marker not found')
              block_start = text.rfind('<TouchableOpacity', 0, action_index)
              if block_start < 0:
                  raise SystemExit('Out-for-delivery button start not found')
              navigation = """          <TouchableOpacity\n            activeOpacity={0.8}\n            style={{\n              flex: 1,\n              flexDirection: 'row',\n              paddingVertical: 10,\n              borderRadius: 99,\n              alignItems: 'center',\n              justifyContent: 'center',\n              backgroundColor: COLORS.emeraldGreen,\n              marginRight: 8,\n            }}\n            onPress={() => handleNavigateToCustomer(item)}\n            disabled={submitting}\n          >\n            <Ionicons name=\"navigate-outline\" size={18} color={COLORS.white} style={{ marginRight: 6 }} />\n            <Text style={styles.completeButtonText}>Navigate</Text>\n          </TouchableOpacity>\n\n"""
              text = text[:block_start] + navigation + text[block_start:]

          path.write_text(text)
          PY

      - name: Commit branch changes
        run: |
          git config user.name "Rivo Automation"
          git config user.email "rivo.city1@gmail.com"
          git add "src/app/(tabs)/deliveries.tsx"
          git commit -m "feat(rider): integrate free customer navigation"
          git push origin HEAD:feature/map-navigation

      - name: Remove temporary workflows
        if: always()
        run: |
          git config user.name "Rivo Automation"
          git config user.email "rivo.city1@gmail.com"
          git rm -f .github/workflows/fix-map-navigation.yml .github/workflows/map-navigation-patch.yml .github/workflows/apply-map-navigation.yml 2>/dev/null || true
          git commit -m "chore: remove temporary map workflows" || true
          git push origin HEAD:feature/map-navigation || true
