name: Apply Map Navigation Patch

on:
  push:
    branches:
      - feature/map-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-navigation

      - name: Patch rider deliveries screen
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/(tabs)/deliveries.tsx')
          text = path.read_text()

          text = text.replace(
              "import { supabase } from '../../lib/supabase';",
              "import { supabase } from '../../lib/supabase';\nimport { navigateToCustomer } from '../../lib/customerNavigation';",
              1,
          )

          text = text.replace(
              "  customer_address_id?: string | null;\n  customer: { customer_name: string; phone?: string | null } | null;",
              "  customer_address_id?: string | null;\n  vendor_location: { latitude: number | null; longitude: number | null } | null;\n  customer: { customer_name: string; phone?: string | null } | null;",
              1,
          )

          marker = "      const orderIds = (ordersData || []).map((o: any) => o.id);"
          insert = """      const vendorIds = Array.from(\n        new Set(\n          (ordersData || [])\n            .map((order: any) => order.vendor_id)\n            .filter(Boolean)\n        )\n      );\n\n      const vendorLocationsMap: Record<string, { latitude: number | null; longitude: number | null }> = {};\n\n      if (vendorIds.length > 0) {\n        const { data: vendorProfiles, error: vendorProfilesError } = await supabase\n          .from('vendor_profiles')\n          .select('vendor_id, latitude, longitude')\n          .in('vendor_id', vendorIds);\n\n        if (vendorProfilesError) {\n          console.warn('Vendor location lookup warning:', vendorProfilesError);\n        } else if (vendorProfiles) {\n          vendorProfiles.forEach((profile: any) => {\n            vendorLocationsMap[profile.vendor_id] = {\n              latitude: profile.latitude ?? null,\n              longitude: profile.longitude ?? null,\n            };\n          });\n        }\n      }\n\n"""
          if marker not in text:
              raise SystemExit('Vendor location insertion marker not found')
          text = text.replace(marker, insert + marker, 1)

          text = text.replace(
              "          customer_address_id: order.customer_address_id || null,\n          customer: Array.isArray(order.customer) ? order.customer[0] : order.customer,",
              "          customer_address_id: order.customer_address_id || null,\n          vendor_location: vendorLocationsMap[order.vendor_id] || null,\n          customer: Array.isArray(order.customer) ? order.customer[0] : order.customer,",
              1,
          )

          marker = "  const handleCallContact = (type: 'vendor' | 'customer', order: Order) => {"
          insert = """  const handleNavigateToCustomer = async (order: Order) => {\n    const opened = await navigateToCustomer(\n      order.vendor_location || {},\n      order.customer_addresses || {}\n    );\n\n    if (opened) {\n      showSuccessToast('Opening Google Maps Navigation');\n    }\n  };\n\n"""
          if marker not in text:
              raise SystemExit('Navigation handler insertion marker not found')
          text = text.replace(marker, insert + marker, 1)

          marker = "  const styles = StyleSheet.create({"
          # Insert style next to the existing button styles using a stable nearby declaration.
          style_marker = "    completeButtonText: {"
          if style_marker not in text:
              raise SystemExit('Button style marker not found')
          text = text.replace(
              style_marker,
              "    navigationButton: {\n      flex: 1,\n      flexDirection: 'row',\n      paddingVertical: 10,\n      borderRadius: 99,\n      alignItems: 'center',\n      justifyContent: 'center',\n    },\n    completeButtonText: {",
              1,
          )

          # Add the navigation action immediately before the Complete button in the out-for-delivery state.
          action_marker = "<Text style={styles.completeButtonText}>Complete</Text>"
          if action_marker not in text:
              raise SystemExit('Complete button marker not found')
          action_index = text.find(action_marker)
          block_start = text.rfind('<TouchableOpacity', 0, action_index)
          if block_start < 0:
              raise SystemExit('Complete button block start not found')
          navigation = """          <TouchableOpacity\n            activeOpacity={0.8}\n            style={[styles.navigationButton, { backgroundColor: COLORS.emeraldGreen }]}\n            onPress={() => handleNavigateToCustomer(item)}\n            disabled={submitting}\n          >\n            <Ionicons name=\"navigate-outline\" size={18} color={COLORS.white} style={{ marginRight: 6 }} />\n            <Text style={styles.completeButtonText}>Navigate</Text>\n          </TouchableOpacity>\n\n"""
          text = text[:block_start] + navigation + text[block_start:]

          path.write_text(text)
          PY

      - name: Commit patched rider map navigation
        run: |
          git config user.name "Rivo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "src/app/(tabs)/deliveries.tsx"
          git commit -m "feat(rider): add free customer navigation"
          git push origin HEAD:feature/map-navigation

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/map-navigation-patch.yml || true
          git commit -m "chore: remove map navigation patch workflow" || true
          git push origin HEAD:feature/map-navigation || true
